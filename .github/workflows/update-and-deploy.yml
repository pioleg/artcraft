name: Update and deploy ArtCraft

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and install all latest apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_apps.py

      - name: Check final website size
        run: |
          echo "Calculating final website size..."
          du -sh public

          size=$(du -sb public | cut -f1)
          if [ "$size" -gt 950000000 ]; then
            echo "ERROR: Website exceeds the configured 950 MB limit."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website for deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy website to GitHub Pages
        uses: actions/deploy-pages@v4
