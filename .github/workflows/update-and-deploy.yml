name: Update and deploy ArtCraft

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository files
        uses: actions/checkout@v4

      # Download the most recent successful run's app files.
      - name: Download previous app files artifact
        id: download_apps
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: update-and-deploy.yml
          name: artcraft-app-files
          branch: main
          path: /tmp/artcraft-previous-apps
          search_artifacts: true
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous app files
        if: steps.download_apps.outcome == 'success'
        run: |
          SOURCE="/tmp/artcraft-previous-apps"

          if [ -d "$SOURCE" ] && [ -n "$(ls -A "$SOURCE" 2>/dev/null)" ]; then
            echo "Restoring previously downloaded app files..."
            mkdir -p public/apps
            cp -a "$SOURCE"/. public/apps/
            echo "Previous app files restored."
            echo "Restored app directories:"
            find public/apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          else
            echo "No previous app files were found. Apps will be downloaded as needed."
          fi

      # Download the release state from the previous successful run.
      - name: Download previous release state artifact
        id: download_state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: update-and-deploy.yml
          name: artcraft-release-state
          branch: main
          path: /tmp/artcraft-previous-state
          search_artifacts: true
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous release state
        if: steps.download_state.outcome == 'success'
        run: |
          SOURCE="/tmp/artcraft-previous-state"

          if [ -d "$SOURCE" ] && [ -f "$SOURCE/apps-state.json" ]; then
            echo "Restoring previous app release versions..."
            mkdir -p .state
            cp "$SOURCE/apps-state.json" .state/apps-state.json
            echo "Restored release state:"
            cat .state/apps-state.json
          else
            echo "No previous release state found. Apps will be checked as new."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check releases and download updated apps
        run: |
          echo "Checking ArtCraft repositories for new releases."
          echo "Unchanged apps with restored files will be kept."
          echo "New or changed releases will be downloaded and installed."
          python scripts/update_apps.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Report app update results
        id: app_changes
        run: |
          changed="$(cat .apps-changed)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          if [ "$changed" = "true" ]; then
            echo "At least one app was downloaded or replaced."
          else
            echo "No app files needed updating."
          fi

          echo "Current app directories:"
          find public/apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      # Save the resulting app files for the next run.
      - name: Upload app files artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-app-files
          path: public/apps/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      # Save the release tags and asset IDs for the next run.
      - name: Upload release state artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-release-state
          path: .state/apps-state.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      # Only check repository changes on push events.
      - name: Check for repository file changes
        id: repo_changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'index.html'
              - 'public/**'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Decide whether deployment is needed
        id: deploy_check
        env:
          APP_CHANGED: ${{ steps.app_changes.outputs.changed }}
          SITE_CHANGED: ${{ steps.repo_changes.outputs.site }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$APP_CHANGED" == "true" ||
                ( "$EVENT_NAME" == "push" && "$SITE_CHANGED" == "true" ) ||
                "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Deployment required."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected. Skipping deployment."
          fi

      - name: Check final website size
        if: steps.deploy_check.outputs.needed == 'true'
        run: |
          echo "Calculating final website size..."
          du -sh public

          size=$(du -sb public | cut -f1)
          if [ "$size" -gt 950000000 ]; then
            echo "ERROR: Website exceeds the configured 950 MB limit."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/configure-pages@v5

      - name: Package website for deployment
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy website to GitHub Pages
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/deploy-pages@v4
