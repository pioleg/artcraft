name: Update and deploy ArtCraft

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous app files
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: update-and-deploy.yml
          name: artcraft-app-files
          branch: main
          path: public
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous release state
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: update-and-deploy.yml
          name: artcraft-release-state
          branch: main
          path: .state
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for repository file changes
        id: repo_changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'index.html'
              - 'public/**'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and prepare apps
        run: python scripts/update_apps.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Check for app updates
        id: app_changes
        run: echo "changed=$(cat .apps-changed)" >> "$GITHUB_OUTPUT"

      - name: Upload app files artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-app-files
          path: public/apps/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Upload release state artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-release-state
          path: .state/apps-state.json
          retention-days: 90
          if-no-files-found: error

      - name: Check whether deployment is needed
        id: deploy_check
        env:
          APP_CHANGED: ${{ steps.app_changes.outputs.changed }}
          SITE_CHANGED: ${{ steps.repo_changes.outputs.site }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$APP_CHANGED" == "true" ||
                ( "$EVENT_NAME" == "push" && "$SITE_CHANGED" == "true" ) ||
                "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check site size
        if: steps.deploy_check.outputs.needed == 'true'
        run: |
          du -sh public
          size=$(du -sb public | cut -f1)
          if [ "$size" -gt 950000000 ]; then
            echo "Site is too large for GitHub Pages"
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.deploy_check.outputs.needed == 'true'
        uses: actions/deploy-pages@v4
