<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtCraft Apps</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #eee;
    }

    body {
      margin: 0;
      background: #000;
      color: #eee;
    }

    main {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    #search {
      display: block;
      width: 100%;
      margin: 0 0 20px;
      padding: 12px 14px;
      border: 1px solid #444;
      border-radius: 0;
      outline: none;
      background: #111;
      color: #fff;
      font: inherit;
    }

    #search:focus {
      border-color: #aaa;
    }

    #apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1px;
    }

    .app {
      display: flex;
      min-width: 0;
      gap: 14px;
      align-items: flex-start;
      padding: 18px;
      background: #000;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      outline-offset: -3px;
    }

    .app:hover,
    .app:focus-visible {
      background: #171717;
    }

    .app-icon {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
    }

    .app-description {
      margin: 0 0 10px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.45;
    }

    .app-version {
      display: inline-block;
      color: #888;
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .app-version:hover {
      color: #fff;
    }

    #status {
      padding: 24px 0;
      color: #888;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      main {
        padding: 12px;
      }

      #apps {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <input
      id="search"
      type="search"
      placeholder="Search apps..."
      aria-label="Search apps"
      autocomplete="off"
    >

    <div id="status">Loading apps...</div>
    <section id="apps" aria-label="ArtCraft apps"></section>
  </main>

  <script>
    const appsContainer = document.querySelector("#apps");
    const searchInput = document.querySelector("#search");
    const status = document.querySelector("#status");

    let apps = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function normalizeApp(app) {
      const id = String(app.id ?? app.name ?? "").toLowerCase();
      const repo = app.repository || `https://github.com/storytold/${id}`;
      const iconName = app.iconName || id;

      return {
        ...app,
        id,
        name: app.name || id,
        description: app.description || "",
        version: app.version || "Source",
        url: app.url || `./apps/${id}/`,
        repository: repo,
        icon: app.icon || `${repo.replace(/\/$/, "")}/raw/refs/heads/main/assets/app-icon/${iconName}.ico`
      };
    }

    function renderApps() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = apps.filter(app =>
        `${app.name} ${app.description} ${app.id}`
          .toLowerCase()
          .includes(query)
      );

      appsContainer.innerHTML = filtered.map(app => `
        <a
          class="app"
          href="${escapeHTML(app.url)}"
          aria-label="Open ${escapeHTML(app.name)}"
        >
          <img
            class="app-icon"
            src="${escapeHTML(app.icon)}"
            alt=""
            loading="lazy"
            onerror="this.style.visibility='hidden'"
          >

          <div class="app-info">
            <h2 class="app-name">${escapeHTML(app.name)}</h2>
            <p class="app-description">${escapeHTML(app.description)}</p>
            <span
              class="app-version"
              role="link"
              tabindex="0"
              data-source="${escapeHTML(app.repository)}"
              aria-label="Source code for ${escapeHTML(app.name)}"
            >${escapeHTML(app.version)}</span>
          </div>
        </a>
      `).join("");

      status.hidden = filtered.length > 0;
      status.textContent = query
        ? "No matching apps."
        : "No apps available.";
    }

    // Let the version link open the source repository without opening the app.
    appsContainer.addEventListener("click", event => {
      const version = event.target.closest(".app-version");
      if (!version) return;

      event.preventDefault();
      event.stopPropagation();
      window.location.href = version.dataset.source;
    });

    appsContainer.addEventListener("keydown", event => {
      const version = event.target.closest(".app-version");
      if (!version || !["Enter", " "].includes(event.key)) return;

      event.preventDefault();
      event.stopPropagation();
      window.location.href = version.dataset.source;
    });

    searchInput.addEventListener("input", renderApps);

    async function loadApps() {
      try {
        const response = await fetch("./apps.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load apps.json");

        const data = await response.json();
        apps = (Array.isArray(data) ? data : data.apps || [])
          .map(normalizeApp);

        renderApps();
      } catch (error) {
        status.hidden = false;
        status.textContent = "Failed to load apps. Please try again later.";
        console.error(error);
      }
    }

    loadApps();
  </script>
</body>
</html>
